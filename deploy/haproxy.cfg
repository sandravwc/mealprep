# HAProxy on the Poco: TLS in on 8443, bots filtered by Anubis, app on 8090.
# Cert: acme.sh reloadcmd concatenates fullchain+key into ~/mealprep/tls/haproxy.pem and restarts haproxy.
global
    log stdout format raw local0 info
    maxconn 256
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 900s      # uploads wait on nothing, but keep room
    http-reuse safe

frontend https
    bind :8443 ssl crt /data/data/com.termux/files/home/mealprep/tls/haproxy.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
    http-response set-header Strict-Transport-Security "max-age=31536000"
    default_backend anubis

backend anubis
    server anubis 127.0.0.1:8923 check

# lab: stats page on the LAN only
frontend stats
    bind 192.168.1.106:8404
    stats enable
    stats uri /
    stats refresh 10s
