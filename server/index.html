<!doctype html><html lang="de"><head><meta charset="utf-8"><title>mealprep</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.json">
<style>
body{font:16px system-ui;margin:0;padding:12px;background:#111;color:#eee}
h2{font-size:15px;color:#999;margin:20px 0 6px;text-transform:uppercase}
body>details>summary{font-size:15px;color:#999;text-transform:uppercase;margin-top:12px}#more{margin:8px 0}
label.cam{display:block;background:#2a6;color:#fff;text-align:center;padding:18px;border-radius:12px;font-size:20px}
input[type=file]{display:none}
ul{list-style:none;padding:0;margin:0}li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #222}
li span{flex:1}small{color:#888}.soon small{color:#e94}.gone small{color:#e44}.gone span{color:#e44}
button{background:#333;color:#eee;border:0;border-radius:8px;padding:8px 12px}button.on{background:#2a6}
textarea{width:100%;box-sizing:border-box;background:#222;color:#eee;border:0;border-radius:8px;padding:8px;font:inherit;margin:6px 0}
.date{color:#fc6;font-weight:600}
img{width:56px;height:56px;object-fit:cover;border-radius:6px}
details{border-bottom:1px solid #222}summary{padding:10px 0;cursor:pointer;font-weight:600}summary small{font-weight:400;margin-left:6px}
dialog{border:0;background:#000;padding:0;max-width:100vw;max-height:100vh}dialog img{width:auto;height:auto;max-width:100vw;max-height:100vh;border-radius:0}dialog::backdrop{background:#000c}#msg{color:#fc6;margin:8px 0}
</style></head><body>
<label class="cam">📷 Kassenbon<input type="file" accept="image/*" capture="environment" onchange="up(this.files[0])"></label>
<div id="msg"></div>
<details open><summary>Offen</summary><ul id="open"></ul></details>
<details open><summary>Gekocht</summary><ul id="done"></ul><button id="more" onclick="allSug=1;load()">ältere</button></details>
<details><summary>Geschmack</summary><textarea id="prof" rows="4" placeholder="z.B. mag scharf, kein Koriander, unter der Woche schnell"></textarea><button onclick="saveProf()">speichern</button></details>
<details open><summary>Vorrat<small id="invn"></small></summary><div id="inv"></div></details>
<h2>Bons</h2><div id="rec"></div>
<dialog id="dlg" onclick="this.close()"><img id="big" alt=""></dialog>
<script>
const $=id=>document.getElementById(id);
async function up(f){if(!f)return;$('msg').textContent='Hochladen…';
 const r=await fetch('/upload',{method:'POST',body:f});$('msg').textContent=r.ok?'Wird gelesen, ~2 min':'Upload fehlgeschlagen';load()}
let allSug=0;
function show(f){$('big').src='/receipts/'+f;$('dlg').showModal()}
async function rate(id,v){await fetch('/api/rate/'+id+'/'+v,{method:'POST'});load()}
async function saveProf(){await fetch('/api/profile',{method:'POST',body:$('prof').value});$('msg').textContent='Profil gespeichert'}
async function made(id){await fetch('/api/made/'+id,{method:'POST'});load()}
async function rm(id){await fetch('/api/remove/'+id,{method:'POST'});load()}
async function load(){const s=await (await fetch('/api/state')).json();const today=new Date().toISOString().slice(0,10);
 if(s.pending.length)$('msg').textContent='Wird gelesen: '+s.pending.join(', ');else if($('msg').textContent.startsWith('Wird'))$('msg').textContent='';
 const week=new Date(Date.now()-7*864e5).toISOString().slice(0,10),twoDays=new Date(Date.now()-2*864e5).toISOString().slice(0,10);
 const item=x=>`<span>${x.title}<br><small>${x.text||''}</small><br><small>${(x.uses||[]).join(', ')}</small></span>`;
 const open=s.suggestions.filter(x=>!x.made&&x.time>=twoDays).reverse();
 $('open').innerHTML=open.map(x=>`<li>${item(x)}<button onclick="made('${x.id}')">gekocht</button></li>`).join('')||'<li><small>nichts offen, nächster Vorschlag 17:00</small></li>';
 const done=s.suggestions.filter(x=>x.made&&(allSug||x.time>=week)).reverse();
 $('done').innerHTML=done.map(x=>`<li><span class="date">${x.time.slice(5,10).replace('-','.')}</span>${item(x)}<button class="${x.rating=='up'?'on':''}" onclick="rate('${x.id}','${x.rating=='up'?'none':'up'}')">👍</button><button class="${x.rating=='down'?'on':''}" onclick="rate('${x.id}','${x.rating=='down'?'none':'down'}')">👎</button></li>`).join('')||'<li><small>noch nichts gekocht</small></li>';
 $('more').hidden=allSug||done.length==s.suggestions.filter(x=>x.made).length;
 if(document.activeElement!==$('prof'))$('prof').value=s.profile||'';
 $('invn').textContent=s.inventory.length;
 const tier={bad:'Verdorben?',expired:'Abgelaufen, noch ok',soon:'Bald',ok:'Vorrat'},cls={bad:'gone',expired:'soon',soon:'soon',ok:''};
 const row=i=>`<li class="${cls[i.status]}"><span>${i.name} <small>${i.qty} ${i.unit} · bis ${i.expires}</small></span><button onclick="rm('${i.id}')">weg</button></li>`;
 $('inv').innerHTML=['bad','expired','soon','ok'].map(t=>{const l=s.inventory.filter(i=>i.status==t).sort((a,b)=>a.expires<b.expires?-1:1);
  return l.length?`<h2>${tier[t]} <small>${l.length}</small></h2><ul>${l.map(row).join('')}</ul>`:''}).join('')||'<small>leer</small>';
 const open=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.d));
 const days={};for(const r of s.receipts)(days[r.time]??=[]).push(r);
 $('rec').innerHTML=Object.keys(days).sort().reverse().map((d,n)=>`<details data-d="${d}" ${open.has(d)||(n==0&&!open.size)?'open':''}><summary>${d}<small>${days[d].length} Bon${days[d].length>1?'s':''}</small></summary><ul>${
  days[d].slice().reverse().map(r=>`<li><img src="/receipts/${r.file}" onclick="show('${r.file}')"><span>${r.file.slice(9,11)}:${r.file.slice(11,13)} <small>${r.items.map(i=>i.name).join(', ')||'nichts erkannt'}</small></span></li>`).join('')}</ul></details>`).join('')||'<small>keine</small>'}
load();setInterval(load,10000);
</script></body></html>
