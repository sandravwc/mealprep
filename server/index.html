<!doctype html><html lang="de"><head><meta charset="utf-8"><title>mealprep</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.json">
<style>
body{font:16px system-ui;margin:0;padding:12px 12px 90px;background:#111;color:#eee}
header{display:flex;justify-content:space-between;align-items:center;font-size:20px;padding:4px 0 8px}header button{font-size:22px;padding:4px 12px}
h2{font-size:15px;color:#999;margin:20px 0 6px;text-transform:uppercase}
body>details>summary{font-size:15px;color:#999;text-transform:uppercase;margin-top:12px}#more{margin:8px 0}
.cams{position:fixed;left:12px;right:12px;bottom:12px;display:flex;gap:8px}label.cam{flex:1;background:#2a6;color:#fff;text-align:center;padding:18px 4px;border-radius:12px;font-size:17px;box-shadow:0 4px 16px #000a}label.alt{background:#369}
input[type=file]{display:none}
ul{list-style:none;padding:0;margin:0}li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #222}
li span{flex:1}small{color:#888}small.warn{color:#e94}small b{font-weight:600}.soon small b{color:#e94}.gone small b{color:#e44}.gone span{color:#e44}
button{background:#333;color:#eee;border:0;border-radius:8px;padding:8px 12px}button.on{background:#2a6}
textarea{width:100%;box-sizing:border-box;background:#222;color:#eee;border:0;border-radius:8px;padding:8px;font:inherit;margin:6px 0}
.date{color:#fc6;font-weight:600}
img{width:56px;height:56px;object-fit:cover;border-radius:6px}
details{border-bottom:1px solid #222}summary{padding:10px 0;cursor:pointer;font-weight:600}summary small{font-weight:400;margin-left:6px}
dialog{border:0;background:#000;padding:0;max-width:100vw;max-height:100vh}#set{background:#1a1a1a;color:#eee;padding:16px;border-radius:12px;width:min(92vw,420px)}#set h2{margin-top:8px}
#tags{display:grid;grid-template-columns:1fr 1fr;gap:6px}#tags label{background:#2a2a2a;padding:8px;border-radius:8px;font-size:14px}#tags input{margin-right:6px}#learned{white-space:pre-line}
.row{display:flex;gap:6px;margin:6px 0}.row input{flex:1}input[type=text],input:not([type]){background:#222;color:#eee;border:0;border-radius:8px;padding:8px;font:inherit}
#tagedit span{display:inline-block;background:#2a2a2a;border-radius:8px;padding:4px 8px;margin:2px;font-size:14px}#tagedit b{cursor:pointer;margin-left:6px;color:#e44}
#cats{width:100%;border-collapse:collapse}#cats td{padding:3px}#cats input{width:100%;box-sizing:border-box}#cats input.n{width:3.5em;text-align:center}#cats b{cursor:pointer;color:#e44}dialog img{width:auto;height:auto;max-width:100vw;max-height:100vh;border-radius:0}dialog::backdrop{background:#000c}#msg{color:#fc6;margin:8px 0}
</style></head><body>
<header><b>mealprep</b><button onclick="openSet()">☰</button></header>
<div id="msg"></div>
<details open><summary>Offen</summary><ul id="open"></ul></details>
<details open><summary>Gekocht</summary><ul id="done"></ul><button id="more" onclick="allSug=1;load()">ältere</button></details>

<details open id="propbox"><summary>Schrank-Vorschläge<small id="propn"></small></summary><ul id="props"></ul></details>
<details open><summary>Vorrat<small id="invn"></small></summary><div id="inv"></div></details>
<h2>Bons</h2><div id="rec"></div>
<h2>Schrank-Fotos</h2><div id="fr"></div>
<dialog id="dlg" onclick="this.close()"><img id="big" alt=""></dialog>
<dialog id="set"><form method="dialog"><h2>Geschmack</h2><div id="tags"></div>
<textarea id="prof" rows="3" placeholder="frei: z.B. kein Sellerie, Kinder essen mit"></textarea>
<h2>Gelernt</h2><small id="learned"></small>
<h2>Tags</h2><div id="tagedit"></div><div class="row"><input id="newtag" placeholder="neuer Tag, z.B. mag Käse"><button type="button" onclick="addTag()">+</button></div>
<h2>Kategorien <small>Tage haltbar · Toleranz danach</small></h2><table id="cats"></table><div class="row"><input id="newcat" placeholder="neue Kategorie"><button type="button" onclick="addCat()">+</button></div>
<button onclick="saveAll()">speichern</button> <button>schließen</button></form></dialog>
<div class="cams"><label class="cam">📷 Bon<input type="file" accept="image/*" capture="environment" onchange="up(this.files[0])"></label><label class="cam alt">🧊 Kühl-/Vorratsschrank<input type="file" accept="image/*" capture="environment" onchange="up(this.files[0],'fridge')"></label></div>
<script>
const $=id=>document.getElementById(id);
const de=t=>t?`${t.slice(8,10)}-${t.slice(5,7)}-${t.slice(0,4)}`:'',de5=t=>t?`${t.slice(8,10)}-${t.slice(5,7)}`:'',dt=t=>`${de5(t)} ${t.slice(11,16)}`;
async function up(f,kind){if(!f)return;$('msg').textContent='Hochladen…';
 const r=await fetch('/upload'+(kind?'?kind='+kind:''),{method:'POST',body:f});$('msg').textContent=r.ok?'Wird gelesen, ~2 min':'Upload fehlgeschlagen';load()}
let allSug=0;
function show(f,dir){$('big').src='/'+(dir||'receipts')+'/'+f;$('dlg').showModal()}
async function rate(id,v){await fetch('/api/rate/'+id+'/'+v,{method:'POST'});load()}
let S={};
let C={};
function openSet(){const P=S.profile||{};C=JSON.parse(JSON.stringify(S.config||{categories:{},tags:{}}));render();
 $('prof').value=P.text||'';const up=(S.suggestions||[]).filter(x=>x.rating=='up').map(x=>x.title),dn=(S.suggestions||[]).filter(x=>x.rating=='down').map(x=>x.title);
 $('learned').textContent=`👍 ${up.join(', ')||'–'}\n👎 ${dn.join(', ')||'–'}`;$('set').showModal()}
function render(){const on=new Set([...document.querySelectorAll('#tags input:checked')].map(i=>i.value).concat((S.profile||{}).tags||[]));
 $('tags').innerHTML=Object.entries(C.tags).map(([k,v])=>`<label><input type="checkbox" name="tag" value="${k}" ${on.has(k)?'checked':''}>${v}</label>`).join('');
 $('tagedit').innerHTML=Object.entries(C.tags).map(([k,v])=>`<span>${v}<b onclick="delete C.tags['${k}'];render()">✕</b></span>`).join('');
 $('cats').innerHTML=Object.entries(C.categories).map(([k,[sh,gr]])=>`<tr><td>${k}</td><td><input class="n" value="${sh}" onchange="C.categories['${k}'][0]=+this.value"></td><td><input class="n" value="${gr}" onchange="C.categories['${k}'][1]=+this.value"></td><td>${k=='other'?'':`<b onclick="delete C.categories['${k}'];render()">✕</b>`}</td></tr>`).join('')}
function addTag(){const v=$('newtag').value.trim();if(!v)return;C.tags[v.toLowerCase().replace(/[^a-zäöüß0-9]+/g,'_')]=v;$('newtag').value='';render()}
function addCat(){const v=$('newcat').value.trim().toLowerCase();if(!v)return;C.categories[v]=C.categories[v]||[14,30];$('newcat').value='';render()}
async function saveAll(){await fetch('/api/config',{method:'POST',body:JSON.stringify(C)});await saveProf()}
async function saveProf(){const tags=[...document.querySelectorAll('#tags input:checked')].map(i=>i.value);
 await fetch('/api/profile',{method:'POST',body:JSON.stringify({tags,text:$('prof').value})});$('msg').textContent='Profil gespeichert';load()}
async function prop(id,a){await fetch('/api/proposal/'+id+'/'+a,{method:'POST'});load()}
async function made(id){await fetch('/api/made/'+id,{method:'POST'});load()}
async function rm(id){await fetch('/api/remove/'+id,{method:'POST'});load()}
async function load(){const s=await (await fetch('/api/state')).json();S=s;const today=new Date().toISOString().slice(0,10);
 if(s.pending.length)$('msg').textContent='Wird gelesen: '+s.pending.join(', ');else if($('msg').textContent.startsWith('Wird'))$('msg').textContent='';
 const openDays=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.d));
 const week=new Date(Date.now()-7*864e5).toISOString().slice(0,10),twoDays=new Date(Date.now()-2*864e5).toISOString().slice(0,10);
 const item=x=>`<span>${x.title} <small>${dt(x.time)}</small><br><small>${x.text||''}</small><br><small>${(x.uses||[]).join(', ')}</small></span>`;
 const open=s.suggestions.filter(x=>!x.made&&x.time>=twoDays).reverse();
 $('open').innerHTML=open.map(x=>`<li>${item(x)}<button onclick="made('${x.id}')">gekocht</button></li>`).join('')||'<li><small>nichts offen, nächster Vorschlag 17:00</small></li>';
 const done=s.suggestions.filter(x=>x.made&&(allSug||x.time>=week)).reverse();
 $('done').innerHTML=done.map(x=>`<li><span class="date">${de5(x.time)}</span>${item(x)}<button class="${x.rating=='up'?'on':''}" onclick="rate('${x.id}','${x.rating=='up'?'none':'up'}')">👍</button><button class="${x.rating=='down'?'on':''}" onclick="rate('${x.id}','${x.rating=='down'?'none':'down'}')">👎</button></li>`).join('')||'<li><small>noch nichts gekocht</small></li>';
 $('more').hidden=allSug||done.length==s.suggestions.filter(x=>x.made).length;
 S=s;
 const pr=s.proposals||[];$('propbox').hidden=!pr.length;$('propn').textContent=pr.length;
 $('props').innerHTML=pr.map(p=>`<li><span>${p.kind=='add'?'+ ':'− '}${p.name} <small>${p.kind=='add'?p.category:'nicht mehr gesehen'} · ${dt(p.time)}</small></span><button onclick="prop('${p.id}','accept')">✓</button><button onclick="prop('${p.id}','reject')">✕</button></li>`).join('');
 const fdays={};for(const r of (s.fridge||[]))(fdays[r.time.slice(0,10)]??=[]).push(r);
 $('fr').innerHTML=Object.keys(fdays).sort().reverse().map((d,n)=>`<details data-d="f${d}" ${openDays.has('f'+d)||(n==0&&!openDays.size)?'open':''}><summary>${de(d)}<small>${fdays[d].length} Foto${fdays[d].length>1?'s':''}</small></summary><ul>${
  fdays[d].slice().reverse().map(r=>`<li><img src="/fridge/${r.file}" onclick="show('${r.file}','fridge')"><span>${r.time.slice(11)} <small>${r.seen.join(', ')||'nichts erkannt'}</small>${r.hint?`<br><small class="warn">⚠ ${r.hint}</small>`:''}</span></li>`).join('')}</ul></details>`).join('')||'<small>keine</small>';
 $('invn').textContent=s.inventory.length;
 const shelf=n=>{const c=(S.config||{}).categories||{};return (c[n]||[14,30])[0]};
 const grp=d=>d<=3?'Verdirbt schnell':d<=10?'Hält eine Woche':d<=60?'Hält einen Monat':'Überlebt dich';
 const order=['Verdirbt schnell','Hält eine Woche','Hält einen Monat','Überlebt dich'];
 const tag={bad:'verdorben?',expired:'abgelaufen, noch ok',soon:'läuft in Kürze ab',ok:''},cls={bad:'gone',expired:'soon',soon:'soon',ok:''};
 const row=i=>`<li class="${cls[i.status]}"><span>${i.name} <small>${i.qty} ${i.unit} · bis ${de5(i.expires)}${tag[i.status]?' · <b>'+tag[i.status]+'</b>':''}</small></span><button onclick="rm('${i.id}')">weg</button></li>`;
 const groups={};for(const i of s.inventory)(groups[grp(shelf(i.category))]??=[]).push(i);
 $('inv').innerHTML=order.filter(g=>groups[g]).map(g=>{const l=groups[g].sort((a,b)=>a.expires<b.expires?-1:1);
  return `<h2>${g} <small>${l.length}</small></h2><ul>${l.map(row).join('')}</ul>`}).join('')||'<small>leer</small>';
 const days={};for(const r of s.receipts)(days[r.time]??=[]).push(r);
 $('rec').innerHTML=Object.keys(days).sort().reverse().map((d,n)=>`<details data-d="${d}" ${openDays.has(d)||(n==0&&!openDays.size)?'open':''}><summary>${de(d)}<small>${days[d].length} Bon${days[d].length>1?'s':''}</small></summary><ul>${
  days[d].slice().reverse().map(r=>`<li><img src="/receipts/${r.file}" onclick="show('${r.file}')"><span>${r.file.slice(9,11)}:${r.file.slice(11,13)} <small>${r.items.map(i=>i.name).join(', ')||'nichts erkannt'}</small></span></li>`).join('')}</ul></details>`).join('')||'<small>keine</small>'}
load();setInterval(load,10000);
</script></body></html>
